    <!-- Custom Background Style for Design Studio -->
    <style>
        body.design-studio {
            position: relative;
        }

        .global-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: url('AssetsConst/Bgnoir.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            transform: translateZ(0);
            will-change: transform;
            pointer-events: none;
        }

        .loader-wrap .load-text {
            background-image: url('AssetsConst/Bgnoir.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 200px;
        }

        @media (max-width: 768px) {
            .loader-wrap .load-text {
                background-attachment: scroll !important;
                background-position: center top !important;
                background-size: cover !important;
                background-repeat: no-repeat !important;
            }

            .global-bg {
                background-position: center !important;
                background-size: cover !important;
                background-repeat: no-repeat !important;
                background-attachment: scroll !important;
            }
        }

        .parallax-card {
            background-color: #FF6A3A;
            padding: 40px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .parallax-card button {
            background-color: transparent;
            border: none;
            color: #000;
            font-size: 288px;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>

</head>
